<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>小绪·思路库</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
body{background:#f7f7f5;color:#222;padding:24px;max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:8px}
.logo-badge{width:36px;height:36px;background:#253b70;color:#fff;border-radius:8px;display:grid;place-items:center;font-weight:bold}
.logo-text h1{font-size:18px;font-weight:600}
.logo-text p{font-size:13px;color:#666}
.export-group{display:flex;gap:8px}
button{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-size:13px}
.btn-outline{background:#fff;border:1px solid #ddd}
.btn-primary{background:#253b70;color:#fff}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;padding:16px;border-radius:12px;border:1px solid #eee}
.stat-num{font-size:24px;font-weight:bold;margin-bottom:4px}
.stat-label{font-size:13px;color:#666}
.main-grid{display:grid;grid-template-columns:340px 1fr;gap:20px}
.panel{background:#fff;border-radius:12px;border:1px solid #eee;padding:18px}
.panel-title{font-size:15px;font-weight:600;margin-bottom:12px}
.quick-input textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:14px;min-height:90px;resize:none}
.quick-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.hint{font-size:12px;color:#777}
.inbox-list{margin-top:14px;max-height:360px;overflow-y:auto}
.inbox-item{padding:10px;border-bottom:1px solid #f4f4f4}
.inbox-text{font-size:14px;margin-bottom:4px}
.inbox-ctrl{display:flex;gap:10px;justify-content:flex-end;font-size:12px}
.inbox-ctrl a{color:#253b70;cursor:pointer}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;border:1px solid #ddd;border-radius:8px;padding:8px 10px}
.tag-group{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tag{padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid #ddd;cursor:pointer}
.tag.active{background:#253b70;color:#fff;border-color:#253b70}
.card-item{border:1px solid #eee;border-radius:10px;padding:14px;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-tag{display:inline-block;font-size:11px;padding:2px 6px;background:#eef1f8;color:#253b70;border-radius:4px;margin-right:6px}
.card-date{font-size:12px;color:#777}
.card-opt{font-size:12px;color:#666;gap:10px;display:flex}
.card-opt span{cursor:pointer}
.card-field{margin:8px 0}
.card-field label{font-size:12px;color:#666;display:block;margin-bottom:2px}
.card-field .val{font-size:14px}
.next-val{background:#fff9dd;padding:6px 8px;border-radius:6px}
.empty-tip{color:#999;text-align:center;padding:20px;font-size:14px}
footer{margin-top:24px;text-align:center;font-size:12px;color:#888}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;align-items:center;justify-content:center;z-index:99}
.modal-box{background:#fff;width:min(620px,92vw);border-radius:14px;padding:22px}
.modal-box h3{margin-bottom:16px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:13px;margin-bottom:4px}
.form-row input,.form-row textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
</style>
</head>
<body>
<header>
<div class="logo">
<div class="logo-badge">绪</div>
<div class="logo-text">
<h1>小绪·思路库</h1>
<p>想到就丢进来，需要时一句话调出来</p>
</div>
</div>
<div class="export-group">
<button class="btn-outline" onclick="exportMd()">导出 Markdown</button>
<button class="btn-outline" onclick="exportJson()">导出备份</button>
<button class="btn-outline" onclick="importJson()">导入备份</button>
</div>
</header>
<div class="stat-row">
<div class="stat-card"><div class="stat-num" id="stat-card">0</div><div class="stat-label">思路卡</div></div>
<div class="stat-card"><div class="stat-num" id="stat-tag">0</div><div class="stat-label">问题档案</div></div>
<div class="stat-card"><div class="stat-num" id="stat-inbox">0</div><div class="stat-label">收件箱待整理</div></div>
</div>
<div class="main-grid">
<div class="panel">
<div class="panel-title">快速记一笔</div>
<div class="quick-input">
<textarea id="quickText" placeholder="现在在想什么？一句话就够，不分类、不排版、先记下来。"></textarea>
<div class="quick-row">
<div class="hint">Ctrl / ⌘ + Enter 快速保存</div>
<button class="btn-primary" onclick="addInbox()">记下</button>
</div>
</div>
<div class="panel-title" style="margin-top:18px">收件箱</div>
<div id="inboxList" class="inbox-list"></div>
<div style="margin-top:12px">
<button class="btn-outline" onclick="copyPrompt()">复制整理提示词</button>
</div>
</div>
<div class="panel">
<div class="search-bar">
<input id="searchInput" placeholder="搜索主题、结论、关键词... (Ctrl+K)" oninput="renderCards()">
<button class="btn-primary" onclick="openCard()">+ 新建思路卡</button>
</div>
<div class="tag-group" id="tagGroup"></div>
<div id="cardList"></div>
</div>
</div>
<footer>数据只保存在本机浏览器 · 建议每周导出一次备份 · 小绪 v1.0</footer>
<div class="modal" id="cardModal">
<div class="modal-box">
<h3 id="modalTitle">新建思路卡</h3>
<input type="hidden" id="editId">
<div class="form-row">
<label>主题</label>
<input id="f-title">
</div>
<div class="form-row">
<label>归属问题（标签）</label>
<input id="f-tag" placeholder="例如：情绪、复习节奏">
</div>
<div class="form-row">
<label>当时的结论</label>
<textarea id="f-conclusion" rows="2"></textarea>
</div>
<div class="form-row">
<label>依据</label>
<textarea id="f-base" rows="2"></textarea>
</div>
<div class="form-row">
<label>没想清的</label>
<textarea id="f-question" rows="2"></textarea>
</div>
<div class="form-row">
<label>下一步</label>
<textarea id="f-next" rows="2"></textarea>
</div>
<div class="modal-footer">
<button class="btn-outline" onclick="closeModal()">取消</button>
<button class="btn-primary" onclick="saveCard()">保存</button>
</div>
</div>
</div>
<script>
// 数据
let inbox = JSON.parse(localStorage.getItem('xiaoxu_inbox') || '[]')
let cards = JSON.parse(localStorage.getItem('xiaoxu_cards') || '[]')
let activeTag = null
const promptText = `请按这套规则整理碎片为思路卡：
主题 / 归属问题 / 日期 / 当时的结论 / 依据 / 没想清的 / 下一步
规则：合并重复内容，保留有信息量记录；不编造内容；新结论与旧卡片冲突时保留旧结论并标注【已更新】；归属问题只能从已有的标签里选，无法判断标未分类。
碎片内容：`

// 保存
function save(){
localStorage.setItem('xiaoxu_inbox', JSON.stringify(inbox))
localStorage.setItem('xiaoxu_cards', JSON.stringify(cards))
renderAll()
}
function renderAll(){
renderInbox()
renderTags()
renderCards()
updateStat()
}
function updateStat(){
const tagSet = new Set(cards.map(x=>x.tag))
document.getElementById('stat-card').innerText = cards.length
document.getElementById('stat-tag').innerText = tagSet.size
document.getElementById('stat-inbox').innerText = inbox.length
}
// 收件箱
function addInbox(){
const t = document.getElementById('quickText').value.trim()
if(!t) return
inbox.push({text:t, time:new Date().toLocaleString()})
document.getElementById('quickText').value=''
save()
}
function renderInbox(){
const wrap = document.getElementById('inboxList')
wrap.innerHTML = inbox.map((item,idx)=>`
<div class="inbox-item">
<div class="inbox-text">${escapeHtml(item.text)}</div>
<div class="inbox-ctrl">
<span onclick="toCard(${idx})">整理成卡</span>
<span onclick="delInbox(${idx})">删除</span>
</div>
</div>`).join('')
}
function delInbox(i){inbox.splice(i,1);save()}
function toCard(i){
const item = inbox[i]
openCard()
document.getElementById('f-base').value = item.text
}
function copyPrompt(){
navigator.clipboard.writeText(promptText)
alert('提示词已复制')
}
// 标签
function renderTags(){
const tagSet = new Set(cards.map(x=>x.tag))
const tags = Array.from(tagSet)
const wrap = document.getElementById('tagGroup')
wrap.innerHTML = `<div class="tag ${activeTag===null?'active':''}" onclick="filterTag(null)">全部</div>`
+ tags.map(t=>`<div class="tag ${activeTag===t?'active':''}" onclick="filterTag('${t}')">${escapeHtml(t)}</div>`).join('')
}
function filterTag(t){activeTag = t;renderCards()}
// 思路卡
function renderCards(){
const kw = document.getElementById('searchInput').value.toLowerCase()
let list = [...cards]
if(activeTag!==null) list = list.filter(x=>x.tag === activeTag)
if(kw) list = list.filter(x=>
x.title.toLowerCase().includes(kw) ||
x.conclusion.toLowerCase().includes(kw) ||
x.base.toLowerCase().includes(kw) ||
x.question.toLowerCase().includes(kw) ||
x.next.toLowerCase().includes(kw)
)
const wrap = document.getElementById('cardList')
if(list.length===0){wrap.innerHTML='<div class="empty-tip">暂无思路卡</div>';return}
wrap.innerHTML = list.map(c=>`
<div class="card-item">
<div class="card-head">
<div>
<span class="card-tag">${escapeHtml(c.tag||'未分类')}</span>
<span class="card-date">${c.date}</span>
</div>
<div class="card-opt">
<span onclick="editCard('${c.id}')">编辑</span>
<span onclick="delCard('${c.id}')">删除</span>
</div>
</div>
<div class="card-field"><label>主题</label><div class="val">${escapeHtml(c.title)}</div></div>
<div class="card-field"><label>当时的结论</label><div class="val">${escapeHtml(c.conclusion)}</div></div>
<div class="card-field"><label>依据</label><div class="val">${escapeHtml(c.base)}</div></div>
<div class="card-field"><label>没想清的</label><div class="val">${escapeHtml(c.question)}</div></div>
<div class="card-field"><label>下一步</label><div class="val next-val">${escapeHtml(c.next)}</div></div>
</div>`).join('')
}
function openCard(){
document.getElementById('modalTitle').innerText='新建思路卡'
document.getElementById('editId').value=''
document.getElementById('f-title').value=''
document.getElementById('f-tag').value=''
document.getElementById('f-conclusion').value=''
document.getElementById('f-base').value=''
document.getElementById('f-question').value=''
document.getElementById('f-next').value=''
document.getElementById('cardModal').style.display='flex'
}
function closeModal(){document.getElementById('cardModal').style.display='none'}
function saveCard(){
const id = document.getElementById('editId').value
const data = {
title:document.getElementById('f-title').value.trim(),
tag:document.getElementById('f-tag').value.trim()||'未分类',
conclusion:document.getElementById('f-conclusion').value.trim(),
base:document.getElementById('f-base').value.trim(),
question:document.getElementById('f-question').value.trim(),
next:document.getElementById('f-next').value.trim(),
date:new Date().toLocaleDateString(),
id:id||uuid()
}
if(!data.title){alert('请填写主题');return}
if(id){
const idx = cards.findIndex(x=>x.id===id)
cards[idx] = data
}else{
cards.push(data)
}
closeModal()
save()
}
function editCard(id){
const c = cards.find(x=>x.id===id)
if(!c) return
document.getElementById('modalTitle').innerText='编辑思路卡'
document.getElementById('editId').value = c.id
document.getElementById('f-title').value = c.title
document.getElementById('f-tag').value = c.tag
document.getElementById('f-conclusion').value = c.conclusion
document.getElementById('f-base').value = c.base
document.getElementById('f-question').value = c.question
document.getElementById('f-next').value = c.next
document.getElementById('cardModal').style.display='flex'
}
function delCard(id){
if(!confirm('确定删除？')) return
cards = cards.filter(x=>x.id!==id)
save()
}
// 导出导入
function exportJson(){
const blob = new Blob([JSON.stringify({inbox,cards},null,2)],{type:'application/json'})
download(blob,'小绪-备份.json')
}
function importJson(){
const input = document.createElement('input')
input.type='file'
input.accept='.json'
input.onchange = e=>{
const fr = new FileReader()
fr.onload = ev=>{
try{
const d = JSON.parse(ev.target.result)
inbox = d.inbox||[]
cards = d.cards||[]
save()
alert('导入成功')
}catch(err){alert('文件解析失败')}
}
fr.readAsText(e.target.files[0])
}
input.click()
}
function exportMd(){
let md = '# 小绪思路库\n\n'
cards.forEach(c=>{
md += `## ${c.title}\n
- 归属：${c.tag||'未分类'}
- 日期：${c.date}
- 结论：${c.conclusion}
- 依据：${c.base}
- 没想清：${c.question}
- 下一步：${c.next}\n\n`
})
const blob = new Blob([md],{type:'text/markdown'})
download(blob,'小绪-思路库.md')
}
function download(blob,name){
const a = document.createElement('a')
a.href = URL.createObjectURL(blob)
a.download = name
a.click()
URL.revokeObjectURL(a.href)
}
function uuid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function escapeHtml(s){
if(!s) return ''
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
// 快捷键
document.addEventListener('keydown',e=>{
if((e.ctrlKey||e.metaKey) && e.key==='Enter'){
const active = document.activeElement
if(active.id === 'quickText'){e.preventDefault();addInbox()}
}
if((e.ctrlKey||e.metaKey) && e.key==='k'){
e.preventDefault()
document.getElementById('searchInput').focus()
}
})
renderAll()
</script>
</body>
</html>
